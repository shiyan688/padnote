plugins {
    id 'application'
}

dependencies {
    implementation 'org.json:json:20231013'
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'com.padnote.agentprobe.AgentProbeMain'
}

tasks.named('run') {
    workingDir rootProject.projectDir.parentFile
}

test {
    useJUnit()
}
