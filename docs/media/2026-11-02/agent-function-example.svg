<title id="figTitle">独立示例曲线 y = x&#178;（不是原手写方程的解答）</title>
<desc id="figDesc">独立的示意性坐标图，画的是抛物线 y 等于 x 平方，仅用于展示抛物线形状。曲线上有三个标注点 (-2,4)、(-1,1) 与 (2,4)。图上文字说明：这条曲线只是独立示例，既不是原手写方程的解答，也不声称该方程的解答是什么。原手写方程写作 f 的平方加上 f(x+1) 等于 x 的平方加 1，本图与求解该方程无关。曲线被裁剪在绘图区矩形内，不会进入标题或警告区。</desc>
